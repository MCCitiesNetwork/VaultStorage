name: VaultStorage
version: "${version}"
main: com.minecraftcitiesnetwork.vaultstorage.VaultStoragePlugin
api-version: "26.3"
description: Stores locked containers as vaults when a region changes hands.
authors: [Alepando]

# join-classpath lets this plugin, and the modules it loads, reach each dependency's classes.
dependencies:
  server:
    Bolt:       { load: BEFORE, required: true,  join-classpath: true }
    WorldGuard: { load: BEFORE, required: true,  join-classpath: true }
    WorldEdit:  { load: BEFORE, required: true,  join-classpath: true }
    Essentials: { load: BEFORE, required: true,  join-classpath: true }
    floodgate:  { load: BEFORE, required: false, join-classpath: true }
    Namebook:   { load: BEFORE, required: false, join-classpath: true }
    ChestShop:  { load: BEFORE, required: false, join-classpath: true }
    Realty:     { load: BEFORE, required: false, join-classpath: true }

# Every permission is declared here with a description and a default.
permissions:
  vaultstorage.user:
    description: Allows using basic vault commands
    default: op
  vaultstorage.admin:
    description: Admin override for vault commands
    default: op
  vaultstorage.action.view:
    description: Allows viewing vaults in a virtual inventory
    default: true
  vaultstorage.action.edit:
    description: Allows editing vault contents in a virtual inventory
    default: op
  vaultstorage.action.copy:
    description: Allows copying items from a vault to the player inventory
    default: op
  vaultstorage.action.place:
    description: Allows placing back the original block and restoring its contents
    default: op
  vaultstorage.admin.override:
    description: Allows capturing/placing vault blocks even if not a region member or outside regions
    default: false
  vaultstorage.action.capture:
    description: Allows capturing a container into a vault (requires region ownership & container ownership unless override)
    default: op
