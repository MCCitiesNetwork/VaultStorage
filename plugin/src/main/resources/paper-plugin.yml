name: VaultStorage
version: "${version}"
main: com.minecraftcitiesnetwork.vaultstorage.VaultStoragePlugin
api-version: "26.3"
description: Stores locked containers as vaults when a region changes hands.
authors: [Alepando]

# join-classpath lets this plugin, and the modules it loads, reach each dependency's classes.
dependencies:
  server:
    Bolt:       { load: BEFORE, required: true,  join-classpath: true }
    WorldGuard: { load: BEFORE, required: true,  join-classpath: true }
    WorldEdit:  { load: BEFORE, required: true,  join-classpath: true }
    floodgate:  { load: BEFORE, required: false, join-classpath: true }
    Namebook:   { load: BEFORE, required: false, join-classpath: true }
    ChestShop:  { load: BEFORE, required: false, join-classpath: true }
    Realty:     { load: BEFORE, required: false, join-classpath: true }
    GriefPrevention: { load: BEFORE, required: false, join-classpath: true }
    PlayerNotifications: { load: BEFORE, required: false, join-classpath: true }

# Every permission is declared here with a description and a default.
permissions:
  # Staff. Also what the menus read for the staff view: everyone's vaults, delete, every region.
  vaultstorage.admin:
    description: Everything, and the staff view in menus.
    default: op
    children:
      vaultstorage.command.vault: true
      vaultstorage.command.vault.others: true
      vaultstorage.command.open: true
      vaultstorage.command.open.others: true
      vaultstorage.command.admin: true
      vaultstorage.command.transfer: true
      vaultstorage.command.reload: true
      vaultstorage.action.view: true
      vaultstorage.action.copy: true
      vaultstorage.action.edit: true
      vaultstorage.action.place: true
      vaultstorage.action.capture: true
      vaultstorage.bypass.region: true
      vaultstorage.scan.teleport: true
  vaultstorage.command.vault:
    description: Open the vault menu with /vault.
    default: op
  vaultstorage.command.vault.others:
    description: Open another player's vaults with /vault menu <player>.
    default: op
  vaultstorage.command.open:
    description: Open a vault by its id with /vault open.
    default: op
  vaultstorage.command.open.others:
    description: Open a vault that belongs to someone else with /vault open.
    default: op
  vaultstorage.command.admin:
    description: Open the menu over every vault with /vault admin.
    default: op
  vaultstorage.command.transfer:
    description: Give a vault to another player with /vault transfer.
    default: op
  vaultstorage.command.reload:
    description: Reload settings and messages with /vault reload.
    default: op
  vaultstorage.action.view:
    description: Look inside a vault.
    default: true
  vaultstorage.action.copy:
    description: Take copies of the items in a vault.
    default: op
  vaultstorage.action.edit:
    description: Change the items in a vault.
    default: op
  vaultstorage.action.place:
    description: Place a vault back into the world as a block.
    default: true
  vaultstorage.action.capture:
    description: Vault a locked container, from the menu or with /vault capture.
    default: op
  vaultstorage.bypass.region:
    description: Capture and place regardless of region and ownership rules.
    default: false
  vaultstorage.scan.teleport:
    description: Teleport to a scan result.
    default: op
