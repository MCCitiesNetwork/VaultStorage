# Test-only stand-in for Realty. See build.gradle.kts.
name: Realty
version: "0.0.0-stub"
main: com.minecraftcitiesnetwork.vaultstorage.e2e.realtystub.RealtyStubPlugin
api-version: "26.3"
depend: [WorldGuard]
commands:
  # No permission node: one with "default: false" is refused to the console too. The command
  # itself answers only the console.
  realtystub:
    description: Fires a Realty event. Console only.
    usage: /realtystub bought <world> <region> <buyer>
